     <section id="contact">
        <h2 class="section-title">Contact</h2>
        <div class="contact-content">
            <div class="contact-info">
                <h3>Contact Details</h3>
                <!-- EmailJS integration -->
                <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
                <script type="text/javascript">
                    (function(){
                        emailjs.init("BabAAS9428WXtdMqQ");
                    })();
                    document.addEventListener('DOMContentLoaded', function() {
                        document.querySelector('.contact-form').addEventListener('submit', function(e) {
                            e.preventDefault();
                            emailjs.sendForm('service_0c9bhrs', 'template_m25sfrh', this)
                                .then(function() {
                                    alert('Thank you for reaching out, Hamza will get back to you soon!');
                                }, function(error) {
                                    alert('Oops! Something went wrong. Please try again later.');
                                });
                            this.reset();
                        });
                    });
                </script>
                <p><strong>Email:</strong> <a href="mailto:mahiperson92@gmail.com">mahiperson92@gmail.com</a></p>
                <p><strong>Phone:</strong> <a href="tel:03348910673">03348910673</a></p>
                <p><strong>Instagram:</strong> <a href="https://instagram.com/hamza_zahooryts" target="_blank">@hamza_zahooryts</a></p>
            </div>
            <form class="contact-form" autocomplete="off">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>
